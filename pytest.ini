[pytest]
# pythonpath = . để import được các package base/, pages/, utils/ từ gốc dự án
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    functional: Kiểm thử chức năng đăng nhập
    security: Kiểm thử bảo mật (SQLi, XSS)
    robustness: Kiểm thử độ bền (brute-force, input dài/đặc biệt)
