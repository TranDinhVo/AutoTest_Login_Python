name: Selenium Tests

# Chạy khi push/PR vào main, hoặc bấm chạy tay (workflow_dispatch)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Quyền cần thiết để deploy GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cài đặt Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Chạy test (headless, trên mock login)
        run: pytest   # report tự sinh vào reports/ theo cấu hình pytest.ini

      - name: Lưu báo cáo test (HTML + JUnit) làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          retention-days: 14

      - name: Chuẩn bị trang Pages (report.html -> index.html)
        if: always()
        run: cp reports/report.html reports/index.html

      - name: Đóng gói report cho GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  # Deploy report lên GitHub Pages (chạy sau job test, kể cả khi có test fail)
  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
