[target]
# ====== Cấu hình mục tiêu kiểm thử ======
# base_url = MOCK  -> dùng trang login giả lập đóng gói sẵn trong thư mục
# mock_login/ (chạy offline, KHÔNG cần mạng, KHÔNG đụng server trường).
#
# Muốn chạy thử trên một trang DEMO công khai (được phép kiểm thử), ví dụ:
#   base_url = https://practicetestautomation.com/practice-test-login/
base_url = MOCK

valid_username = student
valid_password = Password123

# (Locator các phần tử được khai báo trong Page Object: pages/login_page.py)

# Dấu hiệu đăng nhập THÀNH CÔNG: URL chứa chuỗi này
success_url_contains = logged-in-successfully

# ====== Chốt an toàn cho test bảo mật ======
# Test SQLi/XSS CHỈ chạy khi host của base_url nằm trong danh sách này.
# TUYỆT ĐỐI KHÔNG thêm host server production của trường
# (vanphongdientu.utc.edu.vn) vào đây.
security_allowed_hosts = MOCK,localhost,127.0.0.1,practicetestautomation.com

# Headless: true = chạy ngầm không mở cửa sổ. false = xem trình duyệt chạy.
headless = true
# Trình duyệt: chrome hoặc edge
browser = chrome
