<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập (giả lập) - Văn phòng điện tử</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f0f2f5;display:flex;
         justify-content:center;align-items:center;height:100vh;margin:0}
    .box{background:#fff;padding:32px 36px;border-radius:10px;
         box-shadow:0 4px 18px rgba(0,0,0,.12);width:300px}
    h2{margin:0 0 18px;color:#2f5496;text-align:center}
    input[type=text],input[type=password]{width:100%;padding:10px;margin:6px 0 14px;
          border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
    .remember{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px}
    .remember input{margin:0}
    input.submit_login{width:100%;padding:10px;background:#2f5496;color:#fff;border:0;
           border-radius:6px;font-size:15px;cursor:pointer}
    #error{color:#c00;font-size:13px;min-height:18px;margin-top:4px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Đăng nhập</h2>
    <label>Tên đăng nhập</label>
    <input id="username" name="username" type="text" autocomplete="off">
    <label>Mật khẩu</label>
    <input id="password" name="userpwd" type="password" autocomplete="off">
    <div class="remember">
      <input id="remember" name="remember" type="checkbox">
      <label for="remember">Giữ tôi luôn đăng nhập</label>
    </div>
    <input id="submit" class="submit_login" type="button" value="Đăng nhập">
    <div id="error"></div>
  </div>

  <script>
    // ======================================================================
    // TRANG LOGIN GIẢ LẬP (MOCK) - mô phỏng hành vi trang Văn phòng điện tử.
    // Dùng đúng name/class như trang thật (username, userpwd, submit_login)
    // để Page Object giống hệt slide, nhưng chạy OFFLINE, không đụng server.
    // ======================================================================

    var VALID_USER = "student";
    var VALID_PASS = "Password123";

    // Mô phỏng "Giữ tôi luôn đăng nhập": nếu đã đăng nhập + tick giữ
    // (lưu ở localStorage) thì mở lại vào thẳng trang chủ.
    try {
      if (localStorage.getItem("remember_login") === "1") {
        window.location.href = "logged-in-successfully.html";
      }
    } catch (e) {}

    document.getElementById("submit").addEventListener("click", function () {
      // Lấy input dạng CHUỖI thuần (.value) -> không diễn giải như lệnh.
      // Đây là điểm giúp trang an toàn trước SQL Injection / XSS.
      var u = document.getElementsByName("username")[0].value;
      var p = document.getElementsByName("userpwd")[0].value;
      var remember = document.getElementById("remember").checked;
      var err = document.getElementById("error");

      if (u === "" || p === "") {
        err.textContent = "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.";
        return;
      }
      if (u === VALID_USER && p === VALID_PASS) {
        try {
          if (remember) localStorage.setItem("remember_login", "1");
          else localStorage.removeItem("remember_login");
        } catch (e) {}
        window.location.href = "logged-in-successfully.html";
      } else {
        // Thông báo lỗi CHUNG (không nói rõ sai ô nào, không lộ lỗi hệ thống)
        err.textContent = "Tên đăng nhập hoặc mật khẩu không đúng.";
      }
    });
  </script>
</body>
</html>
